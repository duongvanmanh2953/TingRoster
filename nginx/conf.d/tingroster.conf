# ==============================================================================
# TingRoster Reverse Proxy Architecture
# Host-based routing for Landing, Platform Admin, Owner, Student/Member, Kiosk, API
# ==============================================================================

# Upstream Service Definitions
upstream upstream_landing {
    server app-landing:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream upstream_admin {
    server app-admin:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream upstream_owner {
    server app-owner:4001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream upstream_member {
    server app-member:4002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream upstream_kiosk {
    server app-kiosk:4003 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream upstream_api {
    server app-api:4100 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. LANDING & PUBLIC AUTHENTICATION (Port 3000)
# Hosts: tingroster.vn, www.tingroster.vn, tingroster.local, localhost
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name tingroster.vn www.tingroster.vn tingroster.local localhost "";

    client_max_body_size 20M;

    # Rate-limit auth endpoints
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://upstream_landing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://upstream_landing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 2. PLATFORM ADMIN CONTROL CENTER (Port 4000)
# Hosts: admin.tingroster.vn, admin.tingroster.local
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.tingroster.vn admin.tingroster.local;

    client_max_body_size 25M;

    location / {
        proxy_pass http://upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 3. OWNER / FACILITY MANAGER PORTAL (Port 4001)
# Hosts: owner.tingroster.vn, app.tingroster.vn, owner.tingroster.local
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name owner.tingroster.vn app.tingroster.vn owner.tingroster.local;

    client_max_body_size 25M;

    location / {
        proxy_pass http://upstream_owner;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 4. STUDENT / MEMBER PORTAL (Port 4002)
# Hosts: member.tingroster.vn, student.tingroster.vn, member.tingroster.local
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name member.tingroster.vn student.tingroster.vn member.tingroster.local;

    client_max_body_size 10M;

    location / {
        proxy_pass http://upstream_member;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 5. KIOSK TABLET APPLICATION (Port 4003)
# Hosts: kiosk.tingroster.vn, kiosk.tingroster.local
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name kiosk.tingroster.vn kiosk.tingroster.local;

    client_max_body_size 10M;

    location / {
        proxy_pass http://upstream_kiosk;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 6. BACKEND API & WEBHOOK RECEIVER (Port 4100)
# Hosts: api.tingroster.vn, api.tingroster.local
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.tingroster.vn api.tingroster.local;

    client_max_body_size 30M;

    # Rate limiting for public webhook callbacks (SePay, Casso, etc.)
    location /api/webhook/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
